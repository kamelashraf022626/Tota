<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ورد ليكي يا أم تميم 🌸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6e9df; --ink:#5b2a3c; --pink:#c2185b; --soft:#8a5a6b; --ground:#7a4a2a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg)}
  body{
    font-family:'Cairo','Segoe UI','Tahoma','Noto Naskh Arabic',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(60% 45% at 50% 38%, #fbd9e4 0%, rgba(251,217,228,0) 70%),
      var(--bg);
  }
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* ---------- intro ---------- */
  #intro{
    position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;background:var(--bg);
    transition:opacity .9s ease, visibility .9s;
  }
  #intro.hide{opacity:0;visibility:hidden}
  #introLily{width:150px;height:150px;animation:float 3s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-8px) rotate(4deg)}}
  #go{
    font:inherit;font-weight:800;font-size:1.25rem;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,#e91e63,#c2185b);border:0;border-radius:999px;
    padding:.7em 1.8em;box-shadow:0 8px 22px rgba(194,24,91,.35);
    transition:transform .2s;
  }
  #go:active{transform:scale(.96)}
  #intro small{color:var(--soft);font-size:.95rem}

  /* ---------- text ---------- */
  #msg{
    position:fixed;z-index:5;pointer-events:none;
    line-height:1.9;font-weight:600;
    text-shadow:0 1px 0 rgba(255,255,255,.6);
  }
  #msg p{min-height:1.9em;font-size:clamp(1rem,4.2vw,1.35rem);margin-bottom:.35em}
  #msg p.last{font-size:clamp(1.25rem,5.4vw,1.8rem);font-weight:800;color:var(--pink);margin-top:.5em}
  #msg p.typing::after{content:"";display:inline-block;width:2px;height:1.1em;background:var(--pink);
    margin-inline-start:3px;vertical-align:-.2em;animation:blink .8s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  #counter{
    position:fixed;z-index:5;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 3.2vh);
    text-align:center;opacity:0;transition:opacity 1.5s ease;padding:0 16px;
  }
  #counter.show{opacity:1}
  #counter .lbl{font-size:clamp(.9rem,3.6vw,1.1rem);color:var(--soft);font-weight:600}
  #counter .num{font-size:clamp(1.05rem,4.6vw,1.5rem);font-weight:800;color:var(--pink);
    font-variant-numeric:tabular-nums;margin-top:.15em}

  /* portrait: text on top; landscape: text on the right */
  @media (orientation:portrait){
    #msg{top:5vh;left:7vw;right:7vw;text-align:right}
  }
  @media (orientation:landscape){
    #msg{top:50%;transform:translateY(-55%);right:5vw;width:min(40vw,520px);text-align:right}
  }
</style>
</head>
<body>

<div id="intro">
  <canvas id="introLily" width="300" height="300" style="position:static;width:150px;height:150px"></canvas>
  <button id="go">افتحي الهدية 🌸</button>
  <small>ورد من القلب</small>
</div>

<canvas id="c"></canvas>

<div id="msg"></div>

<div id="counter">
  <div class="lbl">من يوم 30/3/2025 وإنتي في قلبي، ومرّ علينا</div>
  <div class="num" id="num">—</div>
</div>

<script>
(() => {
'use strict';

/* ================= الرسالة ================= */
const LINES = [
  'بحبك يا ست البنات 🤍',
  'ويا أجمل من أي حاجة جميلة، يحبك يا عمري',
  'ربنا يخلينا لبعض ونفضل مع بعض لآخر عمرنا',
  'وميحرمنيش من نعمة وجودك في حياتي',
  'بحبك يا أم تميم 💗'
];
const START_DATE = new Date(2025, 2, 30, 0, 0, 0); // 30/3/2025

/* ================= أدوات ================= */
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const rr = (a, b) => a + (b - a) * rnd();
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeOut = t => 1 - Math.pow(1 - t, 3);

/* ================= رسم زهرة الليلي (Stargazer) ================= */
function petalPath(g, L, W) {
  g.beginPath();
  g.moveTo(0, 0);
  g.bezierCurveTo(-W * .95, -L * .22, -W * 1.05, -L * .80, -W * .12, -L * .98);
  g.quadraticCurveTo(0, -L * 1.06, W * .12, -L * .98);
  g.bezierCurveTo(W * 1.05, -L * .80, W * .95, -L * .22, 0, 0);
  g.closePath();
}
function drawPetal(g, L, W, hueShift) {
  g.save();
  petalPath(g, L, W);
  // أبيض عند الحواف ← وردي ← ماجنتا في المنتصف
  const lg = g.createLinearGradient(-W, 0, W, 0);
  lg.addColorStop(0.00, '#fff7fa');
  lg.addColorStop(0.16, '#fbc4d6');
  lg.addColorStop(0.36, `hsl(${338 + hueShift},78%,58%)`);
  lg.addColorStop(0.50, `hsl(${334 + hueShift},82%,46%)`);
  lg.addColorStop(0.64, `hsl(${338 + hueShift},78%,58%)`);
  lg.addColorStop(0.84, '#fbc4d6');
  lg.addColorStop(1.00, '#fff7fa');
  g.fillStyle = lg; g.fill();
  g.clip();
  // الطرف يفتح للأبيض
  const tg = g.createLinearGradient(0, -L * .55, 0, -L);
  tg.addColorStop(0, 'rgba(255,255,255,0)');
  tg.addColorStop(1, 'rgba(255,255,255,.85)');
  g.fillStyle = tg; g.fillRect(-W * 1.2, -L * 1.1, W * 2.4, L * 1.1);
  // الأخضر عند القلب
  const cg = g.createRadialGradient(0, 0, 0, 0, 0, L * .3);
  cg.addColorStop(0, 'rgba(190,220,80,.95)');
  cg.addColorStop(.55, 'rgba(235,240,150,.6)');
  cg.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = cg; g.fillRect(-W * 1.2, -L * .45, W * 2.4, L * .5);
  // عرق منتصف
  g.strokeStyle = 'rgba(150,15,70,.35)'; g.lineWidth = L * .018;
  g.beginPath(); g.moveTo(0, -L * .08); g.lineTo(0, -L * .8); g.stroke();
  // النقط الغامقة
  for (let i = 0; i < 26; i++) {
    const y = -L * (.14 + rnd() * .66);
    const spread = W * .62 * (1 - Math.abs(y / L + .45) * .55);
    const x = (rnd() * 2 - 1) * spread;
    g.fillStyle = `rgba(${150 + rnd() * 30 | 0},${10 + rnd() * 20 | 0},${60 + rnd() * 25 | 0},${.65 + rnd() * .3})`;
    g.beginPath(); g.ellipse(x, y, L * .022, L * .03, rnd() * 3, 0, 6.3); g.fill();
  }
  g.restore();
}
function makeLily(size, hueShift, rot) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  g.translate(size / 2, size / 2);
  g.rotate(rot);
  const L = size * .47, W = size * .17;
  // 3 بتلات خلفية (بين الأمامية) ثم 3 أمامية
  [30, 150, 270].forEach(a => { g.save(); g.rotate(a * Math.PI / 180); drawPetal(g, L * .96, W * .86, hueShift); g.restore(); });
  [90, 210, 330].forEach(a => { g.save(); g.rotate(a * Math.PI / 180); drawPetal(g, L, W, hueShift); g.restore(); });
  // نجمة خضراء في المنتصف
  g.save();
  for (let i = 0; i < 6; i++) {
    g.rotate(Math.PI / 3);
    g.fillStyle = 'rgba(170,205,70,.9)';
    g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(L * .035, -L * .1, 0, -L * .2); g.quadraticCurveTo(-L * .035, -L * .1, 0, 0); g.fill();
  }
  g.restore();
  // الأسدية البرتقالية
  for (let i = 0; i < 6; i++) {
    const a = i * Math.PI / 3 + .3 + rnd() * .25, len = L * (.34 + rnd() * .1);
    const ex = Math.sin(a) * len, ey = -Math.cos(a) * len;
    g.strokeStyle = '#a8c25a'; g.lineWidth = L * .014;
    g.beginPath(); g.moveTo(0, 0); g.lineTo(ex, ey); g.stroke();
    g.save(); g.translate(ex, ey); g.rotate(a);
    g.fillStyle = '#d9480f';
    g.beginPath(); g.ellipse(0, -L * .045, L * .03, L * .095, 0, 0, 6.3); g.fill();
    g.fillStyle = 'rgba(255,140,40,.7)';
    g.beginPath(); g.ellipse(-L * .008, -L * .05, L * .012, L * .06, 0, 0, 6.3); g.fill();
    g.restore();
  }
  // المدقّة
  g.strokeStyle = '#9ec04e'; g.lineWidth = L * .02;
  g.beginPath(); g.moveTo(0, 0); g.lineTo(L * .05, -L * .4); g.stroke();
  g.fillStyle = '#7a3a6a'; g.beginPath(); g.arc(L * .05, -L * .42, L * .028, 0, 6.3); g.fill();
  return c;
}
function makeLeaf(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.translate(w / 2, h);
  const lg = g.createLinearGradient(-w / 2, 0, w / 2, 0);
  lg.addColorStop(0, '#1f4d2c'); lg.addColorStop(.5, '#2f6b3b'); lg.addColorStop(1, '#173d22');
  g.fillStyle = lg;
  g.beginPath(); g.moveTo(0, 0);
  g.bezierCurveTo(-w * .75, -h * .3, -w * .5, -h * .8, 0, -h);
  g.bezierCurveTo(w * .5, -h * .8, w * .75, -h * .3, 0, 0); g.fill();
  g.strokeStyle = 'rgba(160,210,150,.45)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(0, -h * .05); g.lineTo(0, -h * .9); g.stroke();
  return c;
}
function makeFallPetal(size) {
  const c = document.createElement('canvas'); c.width = size; c.height = size;
  const g = c.getContext('2d'); g.translate(size / 2, size * .92);
  drawPetal(g, size * .85, size * .3, 0);
  return c;
}

/* ================= السبرايتات ================= */
const lilies = [makeLily(160, 0, 0), makeLily(160, -6, .5), makeLily(160, 5, 1.1), makeLily(160, -2, 1.8), makeLily(160, 3, 2.6)];
const leafSprite = makeLeaf(40, 90);
const fallSprites = [makeFallPetal(60), makeFallPetal(60)];

// الأيقونة في شاشة الافتتاح
(() => {
  const ic = document.getElementById('introLily'), g = ic.getContext('2d');
  g.drawImage(lilies[0], 0, 0, 300, 300);
})();

/* ================= بناء الشجرة ================= */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H, DPR, S, bx, by, portrait;

// القلب: معادلة ضمنية
const inHeart = (x, y) => Math.pow(x * x + y * y - 1, 3) - x * x * y * y * y < 0;

const segs = [];
const HEART_K = .38, HEART_CY = -.68; // مركز القلب بالنسبة لـ S
function branch(x, y, ang, len, w, depth, t0) {
  const dur = depth === 0 ? 1.7 : .55;
  const x2 = x + Math.sin(ang) * len, y2 = y - Math.cos(ang) * len;
  segs.push({ x1: x, y1: y, x2, y2, w, w2: w * .72, t0, t1: t0 + dur });
  if (depth >= 4) return;
  const kids = depth === 0 ? 3 : 2;
  for (let i = 0; i < kids; i++) {
    const off = kids === 3 ? (i - 1) * .5 : (i ? 1 : -1) * rr(.25, .42);
    branch(x2, y2, ang + off + rr(-.12, .12), len * (depth === 0 ? .55 : .74), w * .62, depth + 1, t0 + dur * .85);
  }
}
const flowers = [], leaves = [], fall = [];
function build() {
  seed = 11; segs.length = 0; flowers.length = 0; leaves.length = 0; fall.length = 0;
  branch(0, 0, 0, .38, .05, 0, .2);

  const pts = [];
  while (pts.length < 215) {
    const x = rr(-1.18, 1.18), y = rr(-1.02, 1.3);
    if (inHeart(x, y)) pts.push({ x, y });
  }
  // الورد يتفتح من تحت لفوق
  const wx = 0, wy = -.4;
  pts.sort((a, b) => Math.hypot(a.x, a.y - .0) - Math.hypot(b.x, b.y - 0));
  pts.forEach((p, i) => {
    flowers.push({
      hx: p.x, hy: p.y,
      s: rr(.078, .108), rot: rr(0, 6.28),
      spr: lilies[i % lilies.length],
      t0: 3.4 + (i / pts.length) * 3.6 + rnd() * .25
    });
  });
  flowers.sort((a, b) => b.hy - a.hy); // اللي فوق يترسم الأول
  flowers.forEach(f => f.draw = f.t0);

  for (let i = 0; i < 300; i++) {
    let x, y; do { x = rr(-1.22, 1.22); y = rr(-1.08, 1.34); } while (!inHeart(x * .94, y * .94));
    leaves.push({
      hx: x, hy: y,
      ang: Math.atan2(x, y - .1) + rr(-1.1, 1.1),
      s: rr(.05, .085),
      t0: 3 + rnd() * 3.2
    });
  }
  for (let i = 0; i < 26; i++) fall.push({ i, init: false });
}

function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  portrait = H > W;
  if (portrait) {
    by = H * .83;
    S = Math.min(W * .98, (by - H * .31) / 1.18);
    bx = W / 2;
  } else {
    by = H * .84;
    S = Math.min(W * .5, (by - H * .06) / 1.18);
    bx = W * .27;
  }
}
addEventListener('resize', layout);

/* ================= الحلقة ================= */
let t0 = null, running = false;
const hx2 = (u) => bx + u * HEART_K * S;
const hy2 = (v) => by + (HEART_CY - 0) * S - v * HEART_K * S;

function respawn(p, t) {
  const f = flowers[(Math.random() * flowers.length) | 0];
  p.x = hx2(f.hx); p.y = hy2(f.hy);
  p.vy = rr(.28, .6) * S * .12;
  p.sw = rr(.5, 1.6); p.ph = rr(0, 6.3); p.amp = rr(8, 26) * S / 400;
  p.rot = rr(0, 6.3); p.vr = rr(-1.4, 1.4);
  p.sz = rr(.045, .075) * S;
  p.spr = fallSprites[(Math.random() * 2) | 0];
  p.x0 = p.x; p.life = 0;
}

function frame(ts) {
  if (!t0) t0 = ts;
  const t = (ts - t0) / 1000;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // الأرض
  const gp = clamp(t / 1.0);
  ctx.strokeStyle = '#7a4a2a'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  const gl = portrait ? W * .06 : bx - S * .65, gr = portrait ? W * .94 : bx + S * .65;
  ctx.beginPath(); ctx.moveTo(gl, by); ctx.lineTo(gl + (gr - gl) * easeOut(gp), by); ctx.stroke();

  // الفروع
  ctx.strokeStyle = '#7a4a2a';
  for (const s of segs) {
    const p = clamp((t - s.t0) / (s.t1 - s.t0));
    if (p <= 0) continue;
    const ex = s.x1 + (s.x2 - s.x1) * p, ey = s.y1 + (s.y2 - s.y1) * p;
    const w = (s.w + (s.w2 - s.w) * p) * S;
    ctx.lineWidth = Math.max(1.2, w);
    ctx.beginPath(); ctx.moveTo(bx + s.x1 * S, by + s.y1 * S); ctx.lineTo(bx + ex * S, by + ey * S); ctx.stroke();
  }
  // قاعدة الجذع
  if (t > .2) {
    ctx.fillStyle = '#7a4a2a';
    ctx.beginPath(); ctx.moveTo(bx - .045 * S, by); ctx.quadraticCurveTo(bx - .012 * S, by - .05 * S, bx - .02 * S, by - .1 * S);
    ctx.lineTo(bx + .02 * S, by - .1 * S); ctx.quadraticCurveTo(bx + .012 * S, by - .05 * S, bx + .045 * S, by); ctx.fill();
  }

  // الأوراق
  for (const l of leaves) {
    const p = clamp((t - l.t0) / .8);
    if (p <= 0) continue;
    const sc = easeOut(p) * l.s * S / 90;
    ctx.save(); ctx.translate(hx2(l.hx), hy2(l.hy)); ctx.rotate(l.ang); ctx.scale(sc, sc);
    ctx.drawImage(leafSprite, -20, -90); ctx.restore();
  }
  // الورد
  for (const f of flowers) {
    const p = clamp((t - f.t0) / 1.1);
    if (p <= 0) continue;
    const sz = f.s * S * easeOutBack(p);
    const sway = Math.sin(t * .8 + f.hx * 3) * .05;
    ctx.save(); ctx.translate(hx2(f.hx), hy2(f.hy)); ctx.rotate(f.rot + sway + (1 - p) * 1.2);
    ctx.globalAlpha = clamp(p * 2);
    ctx.drawImage(f.spr, -sz, -sz, sz * 2, sz * 2);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // بتلات بتنزل
  if (t > 7) {
    for (const p of fall) {
      if (!p.init) { respawn(p, t); p.y -= Math.random() * S * .4; p.init = true; }
      p.life += 1 / 60;
      p.y += p.vy * 1; p.vy = Math.min(p.vy + .002, S * .0055);
      p.x = p.x0 + Math.sin(p.life * p.sw + p.ph) * p.amp * 2.2 + p.life * 6;
      p.rot += p.vr * .02;
      if (p.y > by - 4) {
        // تفضل شوية على الأرض وبعدين ترجع
        p.y = by - 3; p.vy = 0; p.vr = 0; p.rest = (p.rest || 0) + 1;
        if (p.rest > 90) { p.rest = 0; respawn(p, t); }
      }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = .92;
      ctx.drawImage(p.spr, -p.sz / 2, -p.sz, p.sz, p.sz); ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  requestAnimationFrame(frame);
}

/* ================= الكتابة والعدّاد ================= */
const msg = document.getElementById('msg');
function typeLines(delayMs) {
  setTimeout(async () => {
    for (let i = 0; i < LINES.length; i++) {
      const p = document.createElement('p');
      if (i === LINES.length - 1) p.className = 'last';
      msg.appendChild(p);
      p.classList.add('typing');
      for (const ch of LINES[i]) {
        p.textContent += ch;
        await new Promise(r => setTimeout(r, 55));
      }
      p.classList.remove('typing');
      await new Promise(r => setTimeout(r, 450));
    }
  }, delayMs);
}
const pad = n => String(n).padStart(2, '0');
function tick() {
  const d = Date.now() - START_DATE.getTime();
  const s = Math.floor(d / 1000);
  const days = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  document.getElementById('num').textContent = `${days} يوم ${pad(h)} ساعة ${pad(m)} دقيقة ${pad(sec)} ثانية`;
}

/* ================= تشغيل ================= */
function start() {
  document.getElementById('intro').classList.add('hide');
  layout(); build();
  t0 = null; requestAnimationFrame(frame);
  typeLines(2600);
  tick(); setInterval(tick, 1000);
  setTimeout(() => document.getElementById('counter').classList.add('show'), 5500);
}
document.getElementById('go').addEventListener('click', start);
if (location.hash === '#auto') start();
layout();
})();
</script>
</body>
</html>
